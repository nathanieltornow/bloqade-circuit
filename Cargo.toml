[workspace]
members = ["crates/squin"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/QuEraComputing/bloqade-circuit"

[workspace.dependencies]
kirin = { git = "https://github.com/nathanieltornow/kirin.git", rev = "93629607358289f168d4c10405ce32a11c07d04a" }
kirin-arith = { git = "https://github.com/nathanieltornow/kirin.git", rev = "93629607358289f168d4c10405ce32a11c07d04a" }
kirin-bitwise = { git = "https://github.com/nathanieltornow/kirin.git", rev = "93629607358289f168d4c10405ce32a11c07d04a" }
kirin-cmp = { git = "https://github.com/nathanieltornow/kirin.git", rev = "93629607358289f168d4c10405ce32a11c07d04a" }
kirin-constant = { git = "https://github.com/nathanieltornow/kirin.git", rev = "93629607358289f168d4c10405ce32a11c07d04a" }
kirin-function = { git = "https://github.com/nathanieltornow/kirin.git", rev = "93629607358289f168d4c10405ce32a11c07d04a" }
kirin-interpreter = { git = "https://github.com/nathanieltornow/kirin.git", rev = "93629607358289f168d4c10405ce32a11c07d04a", features = ["derive"] }
kirin-rewrite = { git = "https://github.com/nathanieltornow/kirin.git", rev = "93629607358289f168d4c10405ce32a11c07d04a" }
kirin-scf = { git = "https://github.com/nathanieltornow/kirin.git", rev = "93629607358289f168d4c10405ce32a11c07d04a" }
kirin-wildcard = { git = "https://github.com/nathanieltornow/kirin.git", rev = "93629607358289f168d4c10405ce32a11c07d04a" }
petgraph = "0.7"
smallvec = "1.13"
thiserror = "2"
